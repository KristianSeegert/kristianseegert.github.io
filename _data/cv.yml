cv:
  name: Kristian Seegert
  label: Photonics physicist
  email: kr.seegert@gmail.com
  location: Søborg, Denmark
  summary: >
    Photonics physicist with expertise in semiconductor photonic devices, nonlinear dynamics,
    and nanoscale light–matter interaction. My research spans analytical theory, numerical modeling,
    electromagnetic simulations, device design, and experimental characterization.

